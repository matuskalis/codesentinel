name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: TypeScript typecheck
        run: pnpm typecheck

      - name: Run tests
        run: pnpm test:run

      - name: Build CLI and Action bundles
        run: pnpm cli:build

      - name: Committed dist matches a fresh build
        run: git diff --exit-code -- dist

      - name: Self-scan the source tree (fails on any finding)
        run: node dist/codesentinel.mjs scan src --fail-on low

      - name: Build dashboard
        run: pnpm build

  action:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Action blocks on a critical finding
        id: blocking
        uses: ./
        with:
          directory: fixtures/next-supabase-service-key-client
          fail-on: high
        continue-on-error: true

      - name: Action passes and reports a medium-confidence finding
        id: advisory
        uses: ./
        with:
          directory: fixtures/next-stripe-webhook-no-verify
          fail-on: high

      - name: Check both results
        env:
          BLOCKING_OUTCOME: ${{ steps.blocking.outcome }}
          ADVISORY_COUNT: ${{ steps.advisory.outputs.findings-count }}
          ADVISORY_LEVEL: ${{ steps.advisory.outputs.risk-level }}
        run: |
          test "$BLOCKING_OUTCOME" = "failure"
          test "$ADVISORY_COUNT" = "1"
          test "$ADVISORY_LEVEL" = "low"
